<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snake — Foltz</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0d1117; color: #dbe4ee;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  .wrap { text-align: center; padding: 16px; }
  header { font-size: 26px; font-weight: 800; letter-spacing: 4px; color: #f0f6fc; }
  header span { color: #39d353; font-size: 14px; letter-spacing: 2px; margin-left: 8px; }
  .hud {
    display: flex; gap: 24px; justify-content: center;
    margin: 12px 0; font-size: 12px; color: #7d8590; letter-spacing: 1px;
  }
  .hud b { color: #39d353; font-size: 16px; margin-left: 6px; }
  #stage { position: relative; display: inline-block; }
  canvas {
    background: #010409; border: 1px solid #21262d; border-radius: 12px;
    box-shadow: 0 0 40px rgba(57, 211, 83, 0.12);
    max-width: min(92vw, 480px); max-height: min(92vw, 480px);
    width: min(92vw, 480px); height: auto; display: block;
  }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    background: rgba(1, 4, 9, 0.82); border-radius: 12px;
    font-size: 15px; letter-spacing: 1px;
  }
  #overlay.hidden { display: none; }
  #overlay .big { font-size: 30px; font-weight: 800; color: #39d353; letter-spacing: 3px; }
  #overlay .dim { color: #7d8590; font-size: 12px; }
  #overlay button {
    margin-top: 8px; background: #39d353; color: #04120a; border: none;
    font: inherit; font-weight: 800; letter-spacing: 2px; font-size: 13px;
    padding: 10px 26px; border-radius: 8px; cursor: pointer;
  }
  footer { margin-top: 12px; font-size: 11px; color: #484f58; letter-spacing: 1px; }
  #mute {
    position: fixed; top: 14px; right: 14px; background: #161b22; color: #7d8590;
    border: 1px solid #21262d; border-radius: 8px; font-size: 16px;
    width: 40px; height: 40px; cursor: pointer;
  }
</style>
</head>
<body>
<button id="mute" title="mute">♪</button>
<div class="wrap">
  <header>SNAKE<span>//FOLTZ</span></header>
  <div class="hud">
    <div>SCORE<b id="score">0</b></div>
    <div>BEST<b id="best">0</b></div>
    <div>SPEED<b id="level">1</b></div>
  </div>
  <div id="stage">
    <canvas id="cv" width="480" height="480"></canvas>
    <div id="overlay">
      <div class="big" id="ovTitle">SNAKE</div>
      <div class="dim" id="ovSub">arrows / wasd to move</div>
      <button id="ovBtn">START</button>
    </div>
  </div>
  <footer>arrows · wasd · space = pause · enter = restart</footer>
</div>
<script>
"use strict";
const N = 20, CELL = 24;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const elScore = document.getElementById("score");
const elBest = document.getElementById("best");
const elLevel = document.getElementById("level");
const overlay = document.getElementById("overlay");
const ovTitle = document.getElementById("ovTitle");
const ovSub = document.getElementById("ovSub");
const ovBtn = document.getElementById("ovBtn");
const muteBtn = document.getElementById("mute");

let snake, dir, dirQueue, food, score, best, level, timer, state, muted;
try { best = parseInt(localStorage.getItem("fz_snake_best"), 10) || 0; }
catch (e) { best = 0; }
try { muted = localStorage.getItem("fz_snake_mute") === "1"; } catch (e) { muted = false; }
let AC = null;

function beep(freq, dur) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.06, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}
function speed() { return Math.max(70, 140 - (level - 1) * 10); }
function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 }; dirQueue = [];
  score = 0; level = 1;
  placeFood();
  elScore.textContent = "0"; elBest.textContent = String(best); elLevel.textContent = "1";
}
function freeCell() {
  const taken = new Set(snake.map(s => s.x + "," + s.y));
  const free = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
    if (!taken.has(x + "," + y)) free.push({ x, y });
  return free.length ? free[(Math.random() * free.length) | 0] : null;
}
function placeFood() { food = freeCell(); }
function step() {
  if (dirQueue.length) {
    const d = dirQueue.shift();
    if (!(d.x === -dir.x && d.y === -dir.y)) dir = d;
  }
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N) return die();
  for (let s of snake) if (s.x === head.x && s.y === head.y) return die();
  snake.unshift(head);
  if (food && head.x === food.x && head.y === food.y) {
    score += 10;
    level = 1 + ((score / 50) | 0);
    elScore.textContent = String(score);
    elLevel.textContent = String(level);
    if (score > best) {
      best = score; elBest.textContent = String(best);
      try { localStorage.setItem("fz_snake_best", String(best)); } catch (e) {}
    }
    beep(660, 0.07);
    placeFood();
    if (!food) return win();
  } else {
    snake.pop();
  }
  draw();
}
function loop() {
  if (state !== "play") return;
  step();
  if (state === "play") timer = setTimeout(loop, speed());
}
function start() {
  clearTimeout(timer);
  reset();
  state = "play";
  overlay.classList.add("hidden");
  draw();
  loop();
}
function die() {
  state = "over";
  clearTimeout(timer);
  beep(150, 0.3);
  showOverlay("WASTED", "score " + score + " · best " + best, "RETRY");
}
function win() {
  state = "over";
  clearTimeout(timer);
  showOverlay("MAXED", "board cleared · " + score, "RETRY");
}
function togglePause() {
  if (state === "play") {
    state = "pause"; clearTimeout(timer);
    showOverlay("PAUSED", "space to resume", "RESUME");
  } else if (state === "pause") {
    state = "play"; overlay.classList.add("hidden");
    loop();
  }
}
function showOverlay(title, sub, btn) {
  ovTitle.textContent = title; ovSub.textContent = sub; ovBtn.textContent = btn;
  overlay.classList.remove("hidden");
}
function draw() {
  ctx.fillStyle = "#010409";
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = "rgba(57,211,83,0.07)";
  ctx.lineWidth = 1;
  for (let i = 1; i < N; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL + 0.5, 0); ctx.lineTo(i * CELL + 0.5, cv.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL + 0.5); ctx.lineTo(cv.width, i * CELL + 0.5); ctx.stroke();
  }
  if (food) {
    const t = Date.now() / 300;
    const r = CELL * 0.32 + Math.sin(t) * 2;
    ctx.save();
    ctx.shadowColor = "#ff3b30"; ctx.shadowBlur = 14;
    ctx.fillStyle = "#ff3b30";
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.shadowColor = "#39d353"; ctx.shadowBlur = 10;
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? "#7ee787" : "#39d353";
    const p = 2;
    ctx.fillRect(s.x * CELL + p, s.y * CELL + p, CELL - p * 2, CELL - p * 2);
  });
  ctx.restore();
}
const KEYS = {
  ArrowUp: { x: 0, y: -1 }, KeyW: { x: 0, y: -1 },
  ArrowDown: { x: 0, y: 1 }, KeyS: { x: 0, y: 1 },
  ArrowLeft: { x: -1, y: 0 }, KeyA: { x: -1, y: 0 },
  ArrowRight: { x: 1, y: 0 }, KeyD: { x: 1, y: 0 }
};
document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); togglePause(); return; }
  if (e.code === "Enter") { start(); return; }
  if (e.code === "KeyM") { toggleMute(); return; }
  const d = KEYS[e.code];
  if (!d) return;
  e.preventDefault();
  if (state !== "play") { start(); dirQueue.push(d); return; }
  const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
  if ((d.x !== -last.x || d.y !== -last.y) && (d.x !== last.x || d.y !== last.y) && dirQueue.length < 3)
    dirQueue.push(d);
});
let tx = 0, ty = 0;
cv.addEventListener("touchstart", e => {
  const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY;
  if (state !== "play" && state !== "pause") start();
}, { passive: true });
cv.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
cv.addEventListener("touchend", e => {
  const t = e.changedTouches[0];
  const dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.hypot(dx, dy) < 24) return;
  const d = Math.abs(dx) > Math.abs(dy)
    ? { x: dx > 0 ? 1 : -1, y: 0 }
    : { x: 0, y: dy > 0 ? 1 : -1 };
  const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
  if ((d.x !== -last.x || d.y !== -last.y) && dirQueue.length < 3) dirQueue.push(d);
});
function toggleMute() {
  muted = !muted;
  muteBtn.style.opacity = muted ? "0.35" : "1";
  try { localStorage.setItem("fz_snake_mute", muted ? "1" : "0"); } catch (e) {}
}
muteBtn.style.opacity = muted ? "0.35" : "1";
muteBtn.addEventListener("click", toggleMute);
ovBtn.addEventListener("click", () => {
  if (state === "pause") togglePause(); else start();
});
reset();
state = "menu";
draw();
</script>
</body>
</html>
